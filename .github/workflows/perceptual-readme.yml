name: Finalize perceptual README
on:
  push:
    branches: [feature/perceptual-compression]
permissions:
  contents: write
jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/perceptual-compression
      - name: Update README and remove this temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text()
          def replace(old,new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected one README match, got {text.count(old)} for {old[:60]!r}')
              text=text.replace(old,new)

          replace(
          "A source-carrying **SVG** keeps the snapshot in a non-rendered metadata element and authenticates the exact drawing bytes. **SVGZ** gzip-compresses the complete SVG without changing its drawing or embedded source. Its visible name contours are also independently reversible from the polygon geometry. A JSON diagram preserves the complete snapshot beside the visualization.\n\n## Lossless image compression",
          "A source-carrying **SVG** keeps the snapshot in a non-rendered metadata element and authenticates the exact drawing bytes. **SVGZ** gzip-compresses the complete SVG without changing its drawing or embedded source. Its visible name contours are also independently reversible from the polygon geometry. A JSON diagram preserves the complete snapshot beside the visualization.\n\nA **perceptual JPEG** is the opt-in small-raster format. Its visible pixels use deterministic quality-96 progressive JPEG with 4:4:4 chroma, while the exact source snapshot is compressed separately into integrity-checked APP15 segments. The JPEG is visually rather than pixel lossless: source recovery remains byte-exact, but the decoded RGB samples are intentionally allowed to differ slightly. Keyed JPEGs encrypt and authenticate the source capsule under a dedicated domain. Keep the original JPEG because image editors and metadata scrubbers may remove APP segments even when the picture still looks unchanged. See [`docs/perceptual-compression.md`](docs/perceptual-compression.md) for the format contract.\n\n## Lossless image compression")

          replace(
          "code-is-magic ./my-project --output magic.png --json diagram.json\ncode-is-magic https://github.com/owner/repo.git --reference COMMIT_SHA --palette parchment --output magic.svg",
          "code-is-magic ./my-project --output magic.png --json diagram.json\ncode-is-magic ./my-project --output magic.jpg\ncode-is-magic ./my-project --perceptual-quality 98 --output magic.jpg\ncode-is-magic https://github.com/owner/repo.git --reference COMMIT_SHA --palette parchment --output magic.svg")

          replace(
          "The same positional `INPUT` accepts a GitHub link, a local source directory, or an original exported PNG/SVG. Image input automatically recovers the complete source snapshot into `recovered.zip` unless `--output` specifies another path.",
          "The same positional `INPUT` accepts a GitHub link, a local source directory, or an original exported PNG/JPEG/SVG/SVGZ. Image input automatically recovers the complete source snapshot into `recovered.zip` unless `--output` specifies another path. `--perceptual-quality` controls direct JPEG export and is intentionally restricted to 95–100; the default is 96.")

          replace(
          "Downloads use the key associated with the displayed artwork. PNG, SVG, and keyed offline JSON all encrypt the embedded source capsule; keyed JSON contains public artwork and ciphertext, not plaintext analysis/source.",
          "Downloads use the key associated with the displayed artwork. PNG, perceptual JPEG, SVG, and keyed offline JSON all encrypt the embedded source capsule; keyed JSON contains public artwork and ciphertext, not plaintext analysis/source.")

          replace(
          "Retain the original exported PNG for recovery; resizing and other pixel edits can still destroy its payload.",
          "Retain original recovery carriers. Resizing or pixel edits can destroy the PNG payload; re-saving a perceptual JPEG can strip its APP15 source segments.")

          replace(
          "Choose, drop, or paste an original exported PNG/SVG in that same input and select **Recover source** to download the complete reconstructed source ZIP entirely in your browser.",
          "Choose, drop, or paste an original exported PNG/JPEG/SVG/SVGZ in that same input and select **Recover source** to download the complete reconstructed source ZIP entirely in your browser.")

          replace(
          "Source folder input, pan/zoom, an inspector outside the artwork, three palettes, PNG/SVG/JSON downloads, and a geometry name decoder are also available.",
          "Source folder input, pan/zoom, an inspector outside the artwork, three palettes, PNG/JPEG/SVG/SVGZ/JSON downloads, and a geometry name decoder are also available.")

          replace(
          "PNG export uses the same Rust `resvg` rasterizer, pixel codec, and PNG encoder as the native CLI. It does not use browser canvas serialization, so native and WebAssembly output bytes are tested for equality. Equal canonical snapshots, artwork, and options produce identical PNG, SVG capsule, and ZIP bytes.",
          "PNG and perceptual JPEG export use the same Rust `resvg` rasterizer as the native CLI; the browser does not use canvas serialization for either format. Equal canonical snapshots, artwork, keys, options, and pinned codec versions produce deterministic PNG, JPEG, SVG capsule, and ZIP bytes.")

          p.write_text(text)
          PY
          rm .github/workflows/perceptual-readme.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/perceptual-readme.yml
          git commit -m "Document perceptual JPEG export and recovery"
          git push origin HEAD:feature/perceptual-compression
