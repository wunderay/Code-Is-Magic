name: Fix perceptual raster budget
on:
  push:
    branches: [feature/perceptual-compression]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/perceptual-compression
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix scale-to-budget sizing and remove this temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/perceptual.rs')
          text=p.read_text()
          old='''    let natural = (size.width() as usize)\n        .checked_mul(size.height() as usize)\n        .ok_or("Artwork dimensions overflow")?;\n    let pixels = natural.clamp(64 * 64, MAX_PIXELS);\n    let aspect = (size.width() as f64 / size.height() as f64).clamp(0.1, 10.0);\n    let width = ((pixels as f64 * aspect).sqrt().ceil() as u32).max(64);\n    let height = (pixels.div_ceil(width as usize) as u32).max(64);\n    if width as usize * height as usize > MAX_PIXELS\n        || width > u16::MAX as u32\n        || height > u16::MAX as u32\n    {\n        return Err("Perceptual image dimensions exceed budget".into());\n    }\n'''
          new='''    let natural_width = size.width().ceil().max(1.0) as u32;\n    let natural_height = size.height().ceil().max(1.0) as u32;\n    let natural = (natural_width as usize)\n        .checked_mul(natural_height as usize)\n        .ok_or("Artwork dimensions overflow")?;\n    let (width, height) = if natural <= MAX_PIXELS\n        && natural_width <= u16::MAX as u32\n        && natural_height <= u16::MAX as u32\n    {\n        (natural_width, natural_height)\n    } else {\n        let scale = (MAX_PIXELS as f64 / natural as f64).sqrt();\n        let width = ((natural_width as f64 * scale).floor() as u32).max(1);\n        let height = ((natural_height as f64 * scale).floor() as u32).max(1);\n        (width.min(u16::MAX as u32), height.min(u16::MAX as u32))\n    };\n    if width as usize * height as usize > MAX_PIXELS {\n        return Err("Perceptual image dimensions exceed budget".into());\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one sizing block, got {text.count(old)}')
          p.write_text(text.replace(old,new))
          PY
          cargo fmt --all
          rm .github/workflows/perceptual-size-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/perceptual.rs .github/workflows/perceptual-size-fix.yml
          git commit -m "Fix perceptual raster budget scaling"
          git push origin HEAD:feature/perceptual-compression
