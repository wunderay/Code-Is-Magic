name: Benchmark perceptual compression
on:
  push:
    branches: [feature/perceptual-compression]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and generate carriers
        run: |
          cargo run --locked --release -- . --output /tmp/exact.png
          cargo run --locked --release -- . --output /tmp/perceptual-a.jpg
          cargo run --locked --release -- . --output /tmp/perceptual-b.jpg
          cmp /tmp/perceptual-a.jpg /tmp/perceptual-b.jpg
          cargo run --locked --release -- /tmp/perceptual-a.jpg --output /tmp/recovered.zip
      - name: Measure size and conservative pixel error
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow==12.0.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import math, statistics
          png=Path('/tmp/exact.png')
          jpg=Path('/tmp/perceptual-a.jpg')
          recovered=Path('/tmp/recovered.zip')
          a=Image.open(png).convert('RGB')
          b=Image.open(jpg).convert('RGB')
          source_dimensions=a.size
          if a.size != b.size:
              a=a.resize(b.size,Image.Resampling.LANCZOS)
          diffs=[]
          squared=0
          count=0
          for pa,pb in zip(a.getdata(), b.getdata()):
              for x,y in zip(pa,pb):
                  d=abs(x-y)
                  diffs.append(d)
                  squared += d*d
                  count += 1
          mse=squared/count
          psnr=float('inf') if mse == 0 else 10*math.log10((255*255)/mse)
          diffs.sort()
          p99=diffs[min(len(diffs)-1, math.ceil(len(diffs)*0.99)-1)]
          reduction=(1-jpg.stat().st_size/png.stat().st_size)*100
          print(f'CIM_BENCH exact_png={png.stat().st_size} jpeg={jpg.stat().st_size} reduction_pct={reduction:.2f} recovered_zip={recovered.stat().st_size} deterministic=true mae={statistics.fmean(diffs):.4f} p99={p99} psnr_db={psnr:.2f} exact_dimensions={source_dimensions[0]}x{source_dimensions[1]} jpeg_dimensions={b.width}x{b.height}')
          PY
