name: Check pull request
# The same gate pages.yml runs before publishing, on every pull request.
# Standard GitHub-hosted runners are free for public repositories.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  profiles:
    uses: ./.github/workflows/profiles.yml
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: false
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m pip install fonttools==4.61.1
      - run: python3 scripts/build-glyphs.py --check
      - run: python3 tests/inscriptions.py
      - run: python3 tests/recovery_cli.py
      - run: npm test
      - run: bash scripts/build-web.sh
      - run: node --test tests/wasm.test.js
