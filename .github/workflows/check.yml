name: Verify
on: [pull_request]
permissions:
  contents: read
jobs:
  profiles:
    uses: ./.github/workflows/profiles.yml
  verify:
    needs: profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m pip install fonttools==4.61.1
      - run: python3 scripts/build-glyphs.py --check
      - run: python3 tests/inscriptions.py
      - run: python3 tests/recovery_cli.py
      - run: npm test
      - run: bash scripts/build-web.sh
      - run: node --test tests/wasm.test.js
