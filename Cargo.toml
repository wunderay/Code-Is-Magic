[package]
name = "code-is-magic"
version = "0.1.0"
edition = "2021"
description = "Transmute source code into connected arcane diagrams"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "code-is-magic"
required-features = ["cli"]
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:reqwest", "dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
wasm-bindgen = "0.2"
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"], optional = true }

[profile.release]
lto = true
opt-level = "s"
strip = true
